<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polityki Prywatności - Aplikacje</title>
    <style>
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-main: #24292e;
            --text-muted: #586069;
            --accent-color: #0366d6;
            --border-color: #e1444a; /* podglądowo/subtelnie */
            --line-color: #e1e4e8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--line-color);
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(27, 31, 35, 0.04);
            overflow: hidden;
        }

        .policy-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .policy-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line-color);
            transition: background-color 0.2s ease;
        }

        .policy-item:last-child {
            border-bottom: none;
        }

        .policy-item:hover {
            background-color: #f1f8ff;
        }

        .app-info {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .app-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .policy-link {
            text-decoration: none;
            background-color: var(--accent-color);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .policy-link:hover {
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Polityki Prywatności</h1>
            <p>Dokumenty dotyczące ochrony prywatności dla tworzonych przeze mnie aplikacji.</p>
        </header>

        <div class="card">
            <ul class="policy-list">
                <!-- Pozycja dla aplikacji rclone -->
                <li class="policy-item">
                    <div class="app-info">
                        <span class="app-name">Rclone Wrapper / Narzędzie</span>
                        <span class="app-desc">Polityka prywatności dla konfiguracji powiązanej z rclone</span>
                    </div>
                    <a href="rclone.html" class="policy-link">Polityka Prywatności</a>
                </li>

                <!-- MIEJSCE NA KOLEJNE APLIKACJE - skopiuj poniższy blok (<li class="policy-item">...</li>) i wklej tutaj, gdy pojawi się kolejna aplikacja -->
            </ul>
        </div>

        <footer>
            &copy; <span id="year"></span> Dawid Jarosz. Wszelkie prawa zastrzeżone.
        </footer>
    </div>

    <script>
        // Automatyczna aktualizacja roku w stopce
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
